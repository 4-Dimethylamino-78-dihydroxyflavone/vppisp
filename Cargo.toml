[package]
name = "vppisp"
version = "0.1.0"
edition = "2021"
description = "PPISP photometric compensation for an image set, calibrated on a dvlt first pass"

[dependencies]
# Scaled JPEG decode for the fit (6048x4032 -> 756x504 via DCT 1/8).
jpeg-decoder = "0.3.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rayon = "1.12.0"
# ExposureTime / FNumber / ISO: the exposure prior that pins PPISP's
# exposure-vs-CRF ambiguity. Same crate and version as vfold.
kamadak-exif = "0.6.1"
# Compute backend: Vulkan first (DX12 / Metal where Vulkan is absent), one
# shader for every vendor, nothing to install. CPU is the fallback rung.
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = "1.25.1"
# SIMD JPEG encode for the corrected frames; the image crate's is ~3x slower.
jpeg-encoder = { version = "0.7.1", features = ["simd"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
